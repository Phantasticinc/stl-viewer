<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e293b"><title>STL Viewer</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0f172a;color:#e2e8f0;font-family:system-ui,sans-serif;overflow:hidden}
#install{position:fixed;top:0;left:0;right:0;z-index:10;padding:14px;font-size:17px;font-weight:600;border:0;background:#2563eb;color:#fff;padding-top:max(14px,env(safe-area-inset-top))}
#install[hidden]{display:none}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;gap:8px;padding:10px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:#1e293bee;flex-wrap:wrap}
#bar button,#bar label{flex:1;min-width:90px;padding:12px;border-radius:10px;border:0;background:#334155;color:#fff;font-size:15px;text-align:center}
#bar label{background:#16a34a}#file{display:none}
#info{position:fixed;left:10px;z-index:4;top:10px;font-size:13px;background:#1e293bcc;padding:8px 10px;border-radius:8px;white-space:pre-line}
body.has-install #info{top:64px}
#drop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#2563eb55;font-size:24px;z-index:20}
body.dragging #drop{display:flex}canvas{display:block;touch-action:none}
#hint{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:#94a3b8;pointer-events:none}
</style></head><body>
<button id="install" hidden>⬇ Install to phone</button>
<div id="info">No model loaded</div><div id="hint">Tap “Open STL” or drop a .stl file here</div>
<div id="drop">Drop STL file</div>
<div id="bar"><label for="file">Open STL</label><input id="file" type="file" accept=".stl,model/stl,application/sla,application/octet-stream">
<button id="reset">Reset view</button><button id="wire">Wireframe</button></div>
<script type="module" src="app.js"></script></body></html>
